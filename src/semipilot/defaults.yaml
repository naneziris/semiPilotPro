# semipilot built-in defaults. Users override only what they need in `.semipilot/config.yaml`
# (deep-merged over this file; lists are replaced, not merged). Times are seconds unless the key says otherwise.
# `semipilot config` prints the effective result.

# Which agent CLI runs the loop: copilot (GitHub Copilot CLI) | claude (Claude Code).
# The interactive steps (refine, spec-critic) run in whichever chat you like; this only picks the loop's runtime.
harness: copilot

runner:
  command: null                  # null = the harness default (`copilot` / `claude`); e.g. "/opt/bin/claude"
  model: null                    # pin a model id for every loop call, or leave the CLI default
  call_timeout_seconds: 1200
  forbidden_flags: []            # extra flags to refuse (each harness already refuses resume/session/bypass flags)
  extra_flags: []                # appended to every call, after the harness's own flags

# Model per loop role; null = runner.model (and that null = the CLI's default). Planner and critics decide what gets
# built — give them your strongest model. The implementer works against locked tests and your checks, so a cheaper
# model there is the usual first saving; measure with the report's "by role" cost line before and after.
models:
  planner: null
  spec-critic: null
  plan-critic: null
  test-writer: null
  test-fixer: null
  implementer: null

# Permission profile per loop role. read = can read and search the repository, cannot edit or run anything but
# read-only git. write = can edit files and run commands (tests), minus the harness deny-list. none = no tools.
roles:
  planner: read
  spec-critic: read
  plan-critic: read
  test-writer: write
  test-fixer: write
  implementer: write
  health: none

harnesses:
  copilot:
    command: copilot
    allow:
      read: ["read", "shell(git log)", "shell(git show)", "shell(git diff)", "shell(git status)", "shell(git ls-files)"]
      write: ["read", "write", "shell"]
      none: []
    deny:
      - "shell(git push)"
      - "shell(git commit)"
      - "shell(git clean)"
      - "shell(git reset)"
      - "shell(git checkout)"
      - "shell(git switch)"
      - "shell(git branch)"
      - "shell(git stash)"
      - "shell(git rebase)"
      - "shell(git merge)"
      - "shell(rm)"
      - "shell(sudo)"
      - "shell(npm publish)"
      - "shell(pip install)"
      - "shell(npm install)"
      - "shell(docker)"
      - "shell(kubectl)"
      - "shell(terraform)"
      - "shell(curl)"
      - "shell(wget)"
      - "url"
      - "memory"
    failure_patterns:
      fatal:
        - "\\b401\\b"
        - "\\b403\\b"
        - "unauthori[sz]ed"
        - "forbidden"
        - "token (has )?expired"
        - "invalid token"
        - "bad credentials"
        - "not (logged in|authenticated)"
        - "no (active )?copilot (subscription|license|seat)"
        - "entitlement"
      quota_exhausted:
        - "quota"
        - "credit limit"
        - "session limit"
        - "premium request"
        - "usage limit"
        - "budget (has been )?exceeded"
        - "out of credits"
      transient:
        - "\\b502\\b"
        - "\\b503\\b"
        - "\\b504\\b"
        - "\\b429\\b"
        - "rate limit"
        - "too many requests"
        - "ECONNRESET"
        - "ECONNREFUSED"
        - "ENOTFOUND"
        - "ETIMEDOUT"
        - "EAI_AGAIN"
        - "socket hang up"
        - "network (error|failure)"
        - "temporarily unavailable"
        - "service unavailable"
        - "fetch failed"

  claude:
    command: claude
    # Claude Code permission rules (https://code.claude.com/docs/en/permissions): deny is evaluated first and wins.
    # `--permission-mode dontAsk` denies anything not allowed here instead of prompting — nothing can wait for a human.
    permission_mode:
      read: dontAsk
      write: dontAsk
      none: dontAsk
    allow:
      read: ["Read", "Grep", "Glob", "Bash(git log *)", "Bash(git show *)", "Bash(git diff *)", "Bash(git status)", "Bash(git ls-files *)"]
      write: ["Read", "Grep", "Glob", "Edit", "Write", "NotebookEdit", "TodoWrite", "Bash"]
      none: []
    deny:
      - "Bash(git push *)"
      - "Bash(git commit *)"
      - "Bash(git clean *)"
      - "Bash(git reset *)"
      - "Bash(git checkout *)"
      - "Bash(git switch *)"
      - "Bash(git branch *)"
      - "Bash(git stash)"
      - "Bash(git stash *)"
      - "Bash(git rebase *)"
      - "Bash(git merge *)"
      - "Bash(rm *)"
      - "Bash(sudo *)"
      - "Bash(npm publish *)"
      - "Bash(pip install *)"
      - "Bash(npm install *)"
      - "Bash(docker *)"
      - "Bash(kubectl *)"
      - "Bash(terraform *)"
      - "Bash(curl *)"
      - "Bash(wget *)"
      - "WebFetch"
      - "WebSearch"
    # --setting-sources: "" loads none of the user/project/local settings files, so an `allow` rule in a repository's
    # .claude/settings.json cannot widen a profile. null = Claude Code's default (all sources).
    setting_sources: ""
    # --bare: skip hooks, plugins, MCP servers and memory files at startup, so every call starts with less context.
    # Requires an API key (ANTHROPIC_API_KEY); bare mode never uses a Claude subscription login. The loop's prompts
    # name the instructions files explicitly, so agents still read AGENTS.md.
    bare: false
    max_turns: {}                  # e.g. {write: 60} — per-profile turn cap (`--max-turns`); empty = CLI default
    max_budget_usd_per_call: null  # e.g. 2.5 — `--max-budget-usd` on every call; the run's report sums the cost
    failure_patterns:
      fatal:
        - "Not logged in"
        - "Please run /login"
        - "Invalid API key"
        - "API Error: 401"
        - "Invalid authentication credentials"
        - "Login expired"
        - "OAuth token (has been )?revoked"
        - "Failed to authenticate"
        - "authentication_failed"
        - "apiKeyHelper failed"
        - "oauth_org_not_allowed"
      quota_exhausted:
        - "hit your (session|weekly|monthly|usage) limit"
        - "usage limit reached"
        - "Credit balance is too low"
        - "exceeded.*max(imum)?[ _-]?budget"
      transient:
        - "API Error: Request rejected \\(429\\)"
        - "temporarily limiting requests"
        - "\\b529\\b"
        - "overloaded"
        - "API Error: 5\\d\\d"
        - "Internal server error"
        - "\\b502\\b"
        - "\\b503\\b"
        - "\\b504\\b"
        - "\\b429\\b"
        - "rate[_ ]limit"
        - "ECONNRESET"
        - "ECONNREFUSED"
        - "ENOTFOUND"
        - "ETIMEDOUT"
        - "EAI_AGAIN"
        - "socket hang up"
        - "fetch failed"

# Extra failure regexes for whichever harness is active, added to its own list, e.g.
#   failure_patterns: {transient: ["upstream connect error"]}
failure_patterns: {}

# Orchestrator-private state (plan.json during the run). Outside the repo on purpose: the implementer is never told
# where it is; Copilot CLI's path verification keeps file tools in the project, and on Claude Code the adapter adds
# Read/Edit deny rules for this folder.
state_dir: "~/.semipilot/state"

infra:
  backoff_start_seconds: 60
  backoff_cap_seconds: 900
  max_outage_seconds: 5400
  max_total_outage_seconds: 9000
  unknown_as_transient_once: true
  retry_window: null

budget:
  max_retries_per_task: 3
  max_iterations: 30
  wall_clock_seconds: 21600
  max_critique_rounds: 2
  max_contract_fixes_per_task: 1

guardrails:
  scope_tolerance_extra_files: 2
  max_expected_files_per_task: 5
  diff_cap_lines_per_task: 400
  diff_cap_lines_per_run: 3000
  allow_new_test_files: true
  stuck_detection: true
  protected_branches: ["main", "master", "develop"]

tests:
  patterns:
    - "tests/**/*.py"
    - "test/**/*.py"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/*_test.go"
  contract_error_patterns:
    - "ImportError"
    - "ModuleNotFoundError"
    - "AttributeError: module"
    - "has no attribute"
    - "cannot import name"
    - "NameError"
    - "TypeError: .*\\(\\) (got an unexpected keyword|takes|missing)"
    - "Cannot find module"
    - "TS2305"
    - "TS2339"
    - "TS2554"
    - "is not a function"
    - "undefined: "

# Knowledge layer (docs/cards + scripts/kb). auto = use it when present.
# When present: preflight runs validate_cmd; before every loop call the orchestrator runs resolve_cmd with the tags
# in requirements.md > Knowledge References and hands the agent the exact reading list; the plan carries a
# Knowledge Updates section for the semipilot-scribe skill.
# `auto` commands: `scripts/kb/kb.py` (Python, v0.2+) when present, else the Node scripts of earlier installs.
knowledge_layer:
  mode: auto                     # auto | on | off
  validate_cmd: auto
  resolve_cmd: auto              # {tags} = comma-separated tags

# The repository's main instructions file (conventions, commands, architecture) that every agent reads first.
# auto = AGENTS.md if present, else .github/copilot-instructions.md, else CLAUDE.md.
instructions_file: auto

# Filled by `semipilot init` from the detected stack; users edit these in .semipilot/config.yaml.
checks: []
check_output_tail_lines: 200

preflight:
  health_prompt: "Reply with exactly the word OK and nothing else."
  auth_check_cmd: null
  token_expiry_env: "SEMIPILOT_TOKEN_EXPIRES_AT"
  quota_check_cmd: null
  criterion_tag_regex: "\\[check:\\s*(?P<ref>[^\\]]+)\\]"

git:
  # Name of the branch a run creates (from the branch you are on). Placeholders: {type} = the spec's
  # frontmatter `type:` (feat, fix, chore, ...; default feat), {feature} = the feature slug, {date} = YYYYMMDD.
  # Follow your repository's convention here, e.g. "feature/{feature}" or "{type}/{feature}-{date}".
  branch: "{type}/{feature}"
  # Commit messages (conventional commits, no bot marker: the branch is reviewed by a human before it merges).
  # Placeholders: {type} (feat/fix/... from the spec, or test/docs/chore for the loop's own commits),
  # {feature} = the feature slug as scope, {subject} = what the commit does.
  commit: "{type}({feature}): {subject}"
