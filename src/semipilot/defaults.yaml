# semipilot built-in defaults. Users override only what they need in `.semipilot/config.yaml`
# (deep-merged over this file; lists are replaced, not merged). Times are seconds unless the key says otherwise.
# `semipilot config` prints the effective result.

# Which agent CLI runs the loop: copilot (GitHub Copilot CLI) | claude (Claude Code).
# The interactive steps (refine, spec-critic) run in whichever chat you like; this only picks the loop's runtime.
harness: copilot

runner:
  command: null                  # null = the harness default (`copilot` / `claude`); e.g. "/opt/bin/claude"
  model: null                    # pin a model id for every loop call, or leave the CLI default
  call_timeout_seconds: 1200
  forbidden_flags: []            # extra flags to refuse (each harness already refuses resume/session/bypass flags)
  extra_flags: []                # appended to every call, after the harness's own flags

# Model per loop role; null = runner.model (and that null = the CLI's default). Planner and critics decide what gets
# built — give them your strongest model. The implementer works against locked tests and your checks, so a cheaper
# model there is the usual first saving; measure with the report's "by role" cost line before and after.
models:
  planner: null
  plan-fidelity-critic: null
  plan-critic: null
  test-writer: null
  test-fixer: null
  implementer: null
  reviewer: null                 # reads the whole diff once per run: a strong model pays for itself here
  chore: null

# Permission profile per loop role. read = can read and search the repository, cannot edit or run anything but
# read-only git. write = can edit files and run commands (tests), minus the harness deny-list. none = no tools.
roles:
  planner: read
  plan-fidelity-critic: read
  plan-critic: read
  test-writer: write
  test-fixer: write
  implementer: write
  reviewer: read
  chore: write
  health: none

harnesses:
  copilot:
    command: copilot
    # prompts longer than this (bytes) go to a file the agent reads, not onto the command line (OS argument limits)
    prompt_file_threshold: 98304
    # What each call cost. Copilot CLI reports premium requests, tokens per model and API time in two places:
    #   session — the `session.shutdown` event in the session's events.jsonl under session_state_dir, read after the
    #             call (nothing about the call changes);
    #   stats   — the block it prints at exit, which --silent suppresses: set `silent: false` to have it printed;
    #             semipilot parses it and cuts it from the answer.
    # source: auto (the stats block when printed, else the session file) | session | stats | off
    usage:
      source: auto
      session_state_dir: "~/.copilot/session-state"
      silent: true
    allow:
      read: ["read", "shell(git log)", "shell(git show)", "shell(git diff)", "shell(git status)", "shell(git ls-files)"]
      write: ["read", "write", "shell"]
      none: []
    deny:
      - "shell(git push)"
      - "shell(git commit)"
      - "shell(git clean)"
      - "shell(git reset)"
      - "shell(git checkout)"
      - "shell(git switch)"
      - "shell(git branch)"
      - "shell(git stash)"
      - "shell(git rebase)"
      - "shell(git merge)"
      - "shell(rm)"
      - "shell(sudo)"
      - "shell(npm publish)"
      - "shell(pip install)"
      - "shell(npm install)"
      - "shell(docker)"
      - "shell(kubectl)"
      - "shell(terraform)"
      - "shell(curl)"
      - "shell(wget)"
      - "url"
      - "memory"
    failure_patterns:
      fatal:
        - "\\b401\\b"
        - "\\b403\\b"
        - "unauthori[sz]ed"
        - "forbidden"
        - "token (has )?expired"
        - "invalid token"
        - "bad credentials"
        - "not (logged in|authenticated)"
        - "no (active )?copilot (subscription|license|seat)"
        - "entitlement"
      quota_exhausted:
        - "quota"
        - "credit limit"
        - "session limit"
        - "premium request"
        - "usage limit"
        - "budget (has been )?exceeded"
        - "out of credits"
      transient:
        - "\\b502\\b"
        - "\\b503\\b"
        - "\\b504\\b"
        - "\\b429\\b"
        - "rate limit"
        - "too many requests"
        - "ECONNRESET"
        - "ECONNREFUSED"
        - "ENOTFOUND"
        - "ETIMEDOUT"
        - "EAI_AGAIN"
        - "socket hang up"
        - "network (error|failure)"
        - "temporarily unavailable"
        - "service unavailable"
        - "fetch failed"

  claude:
    command: claude
    # Claude Code permission rules (https://code.claude.com/docs/en/permissions): deny is evaluated first and wins.
    # `--permission-mode dontAsk` denies anything not allowed here instead of prompting — nothing can wait for a human.
    permission_mode:
      read: dontAsk
      write: dontAsk
      none: dontAsk
    allow:
      read: ["Read", "Grep", "Glob", "Bash(git log *)", "Bash(git show *)", "Bash(git diff *)", "Bash(git status)", "Bash(git ls-files *)"]
      write: ["Read", "Grep", "Glob", "Edit", "Write", "NotebookEdit", "TodoWrite", "Bash"]
      none: []
    deny:
      - "Bash(git push *)"
      - "Bash(git commit *)"
      - "Bash(git clean *)"
      - "Bash(git reset *)"
      - "Bash(git checkout *)"
      - "Bash(git switch *)"
      - "Bash(git branch *)"
      - "Bash(git stash)"
      - "Bash(git stash *)"
      - "Bash(git rebase *)"
      - "Bash(git merge *)"
      - "Bash(rm *)"
      - "Bash(sudo *)"
      - "Bash(npm publish *)"
      - "Bash(pip install *)"
      - "Bash(npm install *)"
      - "Bash(docker *)"
      - "Bash(kubectl *)"
      - "Bash(terraform *)"
      - "Bash(curl *)"
      - "Bash(wget *)"
      - "WebFetch"
      - "WebSearch"
    # --setting-sources: "" loads none of the user/project/local settings files, so an `allow` rule in a repository's
    # .claude/settings.json cannot widen a profile. null = Claude Code's default (all sources).
    setting_sources: ""
    # --bare: skip hooks, plugins, MCP servers and memory files at startup, so every call starts with less context.
    # Requires an API key (ANTHROPIC_API_KEY); bare mode never uses a Claude subscription login. The loop's prompts
    # name the instructions files explicitly, so agents still read AGENTS.md.
    bare: false
    max_turns: {}                  # e.g. {write: 60} — per-profile turn cap (`--max-turns`); empty = CLI default
    max_budget_usd_per_call: null  # e.g. 2.5 — `--max-budget-usd` on every call; the run's report sums the cost
    failure_patterns:
      fatal:
        - "Not logged in"
        - "Please run /login"
        - "Invalid API key"
        - "API Error: 401"
        - "Invalid authentication credentials"
        - "Login expired"
        - "OAuth token (has been )?revoked"
        - "Failed to authenticate"
        - "authentication_failed"
        - "apiKeyHelper failed"
        - "oauth_org_not_allowed"
      quota_exhausted:
        - "hit your (session|weekly|monthly|usage) limit"
        - "usage limit reached"
        - "Credit balance is too low"
        - "exceeded.*max(imum)?[ _-]?budget"
      transient:
        - "API Error: Request rejected \\(429\\)"
        - "temporarily limiting requests"
        - "\\b529\\b"
        - "overloaded"
        - "API Error: 5\\d\\d"
        - "Internal server error"
        - "\\b502\\b"
        - "\\b503\\b"
        - "\\b504\\b"
        - "\\b429\\b"
        - "rate[_ ]limit"
        - "ECONNRESET"
        - "ECONNREFUSED"
        - "ENOTFOUND"
        - "ETIMEDOUT"
        - "EAI_AGAIN"
        - "socket hang up"
        - "fetch failed"

# Extra failure regexes for whichever harness is active, added to its own list, e.g.
#   failure_patterns: {transient: ["upstream connect error"]}
failure_patterns: {}

# Orchestrator-private state (plan.json during the run). Outside the repo on purpose: the implementer is never told
# where it is; Copilot CLI's path verification keeps file tools in the project, and on Claude Code the adapter adds
# Read/Edit deny rules for this folder.
state_dir: "~/.semipilot/state"

infra:
  backoff_start_seconds: 60
  backoff_cap_seconds: 900
  max_outage_seconds: 5400
  max_total_outage_seconds: 9000
  unknown_as_transient_once: true
  retry_window: null

budget:
  max_retries_per_task: 3
  max_iterations: 30
  wall_clock_seconds: 21600
  max_critique_rounds: 2
  max_contract_fixes_per_task: 1
  # Spend caps, checked before every task (null = no cap). They use what the agent CLI reports: dollars on Claude
  # Code; on Copilot CLI premium requests, and dollars once `cost.premium_request_usd` is set.
  max_cost_usd: null
  max_premium_requests: null

# What a Copilot premium request costs you, to show usage as dollars in the report (null = show requests only).
cost:
  premium_request_usd: null

# How much of a run a feature may do without a human. The tier is `risk:` in the requirements' frontmatter
# (semipilot-refine proposes it, Gate 1 checks it), or default_risk when the requirements name none. The plan can
# only raise it: a plan touching a path under `escalate` gets at least that tier, whatever the requirements say.
#   low     the checks are the gate; nothing stops the run
#   medium  + one stop after the critics accept the plan:  semipilot approve <feature>
#   high    + one stop after every task:                   semipilot resume <feature>  /  semipilot rollback
autonomy:
  default_risk: low
  require_risk: false            # true = preflight refuses requirements without `risk:`
  tiers:
    low: {plan_approval: false, task_review: false}
    medium: {plan_approval: true, task_review: false}
    high: {plan_approval: true, task_review: true}
  escalate:                      # globs on the plan's files; `**/x/**` also matches a top-level x/
    medium:
      - "**/auth/**"
      - "**/billing/**"
      - "**/payments/**"
      - "**/migrations/**"
      - "**/*.sql"
      - ".github/workflows/**"
      - ".gitlab-ci.yml"
    high: []

# The review gate. After the last task one read-only `reviewer` call grades the diff against a rubric
# (override it with .semipilot/roles/reviewer.md) and names what a human should read first. Its verdict opens the
# report's review packet; it never blocks a run and never edits anything.
review:
  agent: true
  max_findings: 20

guardrails:
  scope_tolerance_extra_files: 2
  max_expected_files_per_task: 5
  diff_cap_lines_per_task: 400
  diff_cap_lines_per_run: 3000
  allow_new_test_files: true
  stuck_detection: true
  protected_branches: ["main", "master", "develop"]

tests:
  patterns:
    - "tests/**/*.py"
    - "test/**/*.py"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.js"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/*_test.go"
  contract_error_patterns:
    - "ImportError"
    - "ModuleNotFoundError"
    - "AttributeError: module"
    - "has no attribute"
    - "cannot import name"
    - "NameError"
    - "TypeError: .*\\(\\) (got an unexpected keyword|takes|missing)"
    - "Cannot find module"
    - "TS2305"
    - "TS2339"
    - "TS2554"
    - "is not a function"
    - "undefined: "
  # Red before green: right after the tests are locked, each task's tests are run with no implementation yet and
  # must FAIL. A test that already passes proves nothing about the change. warn (flag it in the report) | halt
  # (stop the run: tests_not_red) | off. Needs a check whose command uses {task_tests}.
  red_check: warn

# Knowledge layer (docs/cards + scripts/kb). auto = use it when present.
# When present: preflight runs validate_cmd; before every loop call the orchestrator runs resolve_cmd with the tags
# in requirements.md > Knowledge References and hands the agent the exact reading list; the plan carries a
# Knowledge Updates section for the semipilot-scribe skill.
# `auto` commands: `scripts/kb/kb.py` (Python, v0.2+) when present, else the Node scripts of earlier installs.
knowledge_layer:
  mode: auto                     # auto | on | off
  validate_cmd: auto
  resolve_cmd: auto              # {tags} = comma-separated tags

# The repository's main instructions file (conventions, commands, architecture) that every agent reads first.
# auto = AGENTS.md if present, else .github/copilot-instructions.md, else CLAUDE.md.
instructions_file: auto

# Filled by `semipilot init` from the detected stack; users edit these in .semipilot/config.yaml.
checks: []
check_output_tail_lines: 200
check_output_max_bytes: 16000     # cap on the failing check output pasted into the next prompt (the end is kept)

preflight:
  health_prompt: "Reply with exactly the word OK and nothing else."
  auth_check_cmd: null
  token_expiry_env: "SEMIPILOT_TOKEN_EXPIRES_AT"
  quota_check_cmd: null
  criterion_tag_regex: "\\[check:\\s*(?P<ref>[^\\]]+)\\]"

# Trial semipilot in a team repository without committing it: semipilot's own files (.semipilot/, the skill pack,
# the knowledge-layer tooling, an AGENTS.md / CLAUDE.md that git does not track) go into .git/info/exclude and are
# never committed. The run branch then holds only the feature's code commits — a clean PR.
private: false

git:
  # Your own uncommitted changes that must stay uncommitted — files, folders ending in /, or globs, relative to the
  # project (e.g. ".github/", "package.json"). The clean-tree check ignores them, no commit includes them, resets
  # keep them, and agents may not change them (a plan that needs to is rejected; an edit is reverted).
  local_paths: []
  # Name of the branch a run creates (from the branch you are on). Placeholders: {type} = the spec's
  # frontmatter `type:` (feat, fix, chore, ...; default feat), {feature} = the feature slug, {date} = YYYYMMDD.
  # Follow your repository's convention here, e.g. "feature/{feature}" or "{type}/{feature}-{date}".
  branch: "{type}/{feature}"
  # Commit messages (conventional commits, no bot marker: the branch is reviewed by a human before it merges).
  # Placeholders: {type} (feat/fix/... from the spec, or test/docs/chore for the loop's own commits),
  # {feature} = the feature slug as scope, {subject} = what the commit does.
  commit: "{type}({feature}): {subject}"

# Where issues and merge requests live. auto = from the `origin` remote's URL (github.com → gh, gitlab → glab);
# set it explicitly for a self-hosted GitLab or GitHub Enterprise. Needs that CLI installed and logged in.
#   semipilot intake <issue>     the issue's text → .semipilot/features/<slug>/issue.md, for /semipilot-refine
#   semipilot mr <feature>       push the run branch and open a merge / pull request from the report
forge:
  provider: auto                 # auto | github | gitlab | none
  remote: origin
  base: null                     # the request's target branch; null = the branch the run was started from
  draft: true
  open_mr: manual                # manual = only `semipilot mr`; auto = also right after a run that completed
  commands: {}                   # override a command line: issue_view, mr_create (lists; see docs/configuration.md)

# Chores: one small fix per run, unattended, on its own branch — `semipilot chore [name]`, usually from a scheduler.
# No planner, no critics: the gate is mechanical. The fix must keep every existing test untouched, stay under the
# caps below and pass the checks; with a `find` command the finding must also be gone and no new one may appear.
chores:
  max_files: 3
  max_diff_lines: 80
  max_attempts: 2
  skip_after_failures: 2         # a finding that failed this often is skipped until `semipilot chore --reset`
  max_open: 3                    # unmerged chore branches waiting for review; at this many, nothing new is attempted
  branch: "chore/{chore}-{date}-{id}"
  open_mr: false                 # true = push the branch and open a request for every successful chore
  items: []
  # - name: lint
  #   find: "npx eslint . --format unix"      # one finding per line; the exit code is ignored
  #   match: "^[^:]+:\\d+:\\d+:"                # optional: only lines matching this regex are findings
  #   instruction: "Fix this ESLint finding in the code. No eslint-disable comments."
  #   checks: [lint, tests]                   # optional: which checks gate it (default: all)
