# PilotInLoop autonomous loop — configuration.
# All values are defaults from the handoff (v2). Times are in seconds unless the key says otherwise.

runner:
  command: copilot                 # Copilot CLI binary. Tests point this at tests/fake_copilot.py.
  model: null                      # null = CLI default. Pin for reproducibility, e.g. "claude-sonnet-4".
  call_timeout_seconds: 1200       # 20 min per invocation; timeout counts as a failed task attempt.
  # Custom agents passed via --agent. planner/spec-critic/plan-critic use the dedicated PilotInLoop agents from the
  # pipeline (`pilotinloop-*.agent.md`): same knowledge-layer discipline as @planner/@spec-critic/@pattern-critic,
  # but written for stdout JSON output and no human in the loop. null = prompt only. Do NOT map implementer or
  # test-writer to the pipeline's @implementer: it is built around the YAML rail and a subagent context.
  agents:
    planner: pilotinloop-planner
    spec-critic: pilotinloop-spec-critic
    plan-critic: pilotinloop-plan-critic
    test-writer: null
    test-fixer: null
    implementer: null
    health: null
  # Tool permissions per role (--allow-tool). Deny list below always wins.
  allow_tools:
    planner: ["read", "shell(git:*)"]
    spec-critic: ["read", "shell(git:*)"]
    plan-critic: ["read", "shell(git:*)"]
    test-writer: ["read", "write", "shell"]
    test-fixer: ["read", "write", "shell"]
    implementer: ["read", "write", "shell"]
    health: []
  # Command deny-list, applied to every call as --deny-tool. Extend freely.
  deny_tools:
    - "shell(git push)"
    - "shell(git clean)"
    - "shell(git reset)"
    - "shell(git checkout)"
    - "shell(git branch)"
    - "shell(rm)"
    - "shell(sudo)"
    - "shell(npm publish)"
    - "shell(pip install)"
    - "shell(npm install)"
    - "shell(docker)"
    - "shell(kubectl)"
    - "shell(terraform)"
    - "shell(curl)"
    - "shell(wget)"
    - "url"
    - "memory"
  # Flags the runner refuses to ever put on a command line (fresh session per call is a hard requirement).
  forbidden_flags: ["--resume", "--continue", "--session-id", "-r"]
  # Extra flags appended to every call.
  extra_flags: []

# Where the run reads/writes its human-facing artifacts, relative to the repo root. Defaults follow the
# SemiPilot pipeline layout: the refiner writes `.github/requirements/requirements.md`; open questions and the
# assumptions log (decisions.md, §7) sit next to it. `docs/decisions.md` (the ADR log) is a different file.
paths:
  requirements: ".github/requirements/requirements.md"
  open_questions: ".github/requirements/open-questions.md"
  decisions: ".github/requirements/decisions.md"

# Where plan.json and other orchestrator-private state live. OUTSIDE the repo on purpose: Copilot CLI
# path verification blocks reads outside cwd, so the implementer physically cannot read the plan.
# Supports ~ and env vars. A copy of plan.json is placed in the run log dir at the end of the run for review.
state_dir: "~/.semipilot-pilotinloop"

# Failure classification for Copilot CLI calls (§4.6). Regex, case-insensitive, matched against
# exit code + stdout + stderr. First matching class wins, in this order: fatal, quota_exhausted, transient.
# VERIFY against real CLI output and extend; unknown failures are logged raw for pattern updates.
failure_patterns:
  fatal:
    - "\\b401\\b"
    - "\\b403\\b"
    - "unauthori[sz]ed"
    - "forbidden"
    - "token (has )?expired"
    - "invalid token"
    - "bad credentials"
    - "not (logged in|authenticated)"
    - "no (active )?copilot (subscription|license|seat)"
    - "entitlement"
  quota_exhausted:
    - "quota"
    - "credit limit"
    - "session limit"
    - "premium request"
    - "usage limit"
    - "budget (has been )?exceeded"
    - "out of credits"
  transient:
    - "\\b502\\b"
    - "\\b503\\b"
    - "\\b504\\b"
    - "\\b429\\b"
    - "rate limit"
    - "too many requests"
    - "ECONNRESET"
    - "ECONNREFUSED"
    - "ENOTFOUND"
    - "ETIMEDOUT"
    - "EAI_AGAIN"
    - "socket hang up"
    - "network (error|failure)"
    - "temporarily unavailable"
    - "service unavailable"
    - "fetch failed"

infra:
  backoff_start_seconds: 60        # 1, 2, 4, 8, 16 min ...
  backoff_cap_seconds: 900         # ... capped at 15 min
  max_outage_seconds: 5400         # 90 min continuous → circuit breaker
  max_total_outage_seconds: 9000   # 150 min total for the run → circuit breaker
  unknown_as_transient_once: true  # unknown failure: treat as transient once, then as task failure
  retry_window: null               # e.g. "05:00" — if the breaker trips before this time, schedule one auto-resume

budget:
  max_retries_per_task: 3
  max_iterations: 30               # implementer calls across the whole run
  wall_clock_seconds: 21600        # 6h
  max_critique_rounds: 2
  max_contract_fixes_per_task: 1   # test-fixer calls when locked tests fail on import/name/signature errors

guardrails:
  scope_tolerance_extra_files: 2
  max_expected_files_per_task: 5
  diff_cap_lines_per_task: 400     # implementer diff only; the locked test commit is excluded
  diff_cap_lines_per_run: 3000
  allow_new_test_files: true       # implementer may ADD tests; it may never modify locked ones
  stuck_detection: true
  # Files the orchestrator manages; never counted in scope or diff checks.
  managed_paths:
    - ".github/requirements/decisions.md"
    - ".github/implementation-progress.json"
    - ".github/rejection-log.md"
    - ".github/pilotinloop/runs/"
    - "reports/"
  protected_branches: ["main", "master", "develop"]

# Test lock: files matching these globs are locked after the test-writer stage.
tests:
  patterns:
    - "tests/**/*.py"
    - "test/**/*.py"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*_test.go"
  # Errors that mean the TEST-WRITER guessed an interface wrong (not that the implementation is wrong).
  # When a locked test fails with one of these, the test-fixer is allowed one logged fix of names/imports/signatures.
  contract_error_patterns:
    - "ImportError"
    - "ModuleNotFoundError"
    - "AttributeError: module"
    - "has no attribute"
    - "cannot import name"
    - "NameError"
    - "TypeError: .*\\(\\) (got an unexpected keyword|takes|missing)"
    - "Cannot find module"
    - "TS2305"
    - "TS2339"
    - "TS2554"
    - "is not a function"
    - "undefined: "

# Checks the orchestrator runs after every implementer call. All must pass. Order matters (fast first).
checks:
  - name: lint
    cmd: "ruff check ."
  - name: typecheck
    cmd: "mypy ."
  - name: tests
    cmd: "pytest -q {task_tests}"   # {task_tests} = this task's (+ done tasks') locked test files; empty on the final full-suite run
  - name: build
    cmd: "python -m compileall -q ."
check_output_tail_lines: 200

# Preflight
preflight:
  health_prompt: "Reply with exactly the word OK and nothing else."
  # Optional command that must exit 0 for auth to be considered valid (e.g. "gh auth status").
  auth_check_cmd: "gh auth status"
  # Optional: ISO-8601 timestamp env var with the token's expiry, if you use a PAT with a known expiry.
  token_expiry_env: "COPILOT_TOKEN_EXPIRES_AT"
  # Optional command printing remaining request/credit quota as an integer; null = skip.
  quota_check_cmd: null
  # Acceptance criteria in requirements.md must be tagged with a check reference in this form.
  criterion_tag_regex: "\\[check:\\s*(?P<ref>[^\\]]+)\\]"

git:
  branch_prefix: "pilotinloop/"
  commit_prefix: "[pilotinloop]"
