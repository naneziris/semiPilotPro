[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semipilot"
version = "0.2.0"
description = "Requirements → Gate 1 → PilotInLoop: an unattended, test-first build loop for GitHub Copilot CLI and Claude Code, with humans at the gates, a deterministic knowledge layer, and an Agent Skills pack."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nikos Aneziris" }]
keywords = ["ai-agents", "agent-skills", "github-copilot", "claude-code", "sdlc", "spec-driven-development", "tdd", "knowledge-layer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.urls]
Homepage = "https://github.com/naneziris/semiPilotPro"
Documentation = "https://github.com/naneziris/semiPilotPro/tree/v5/docs"
Changelog = "https://github.com/naneziris/semiPilotPro/blob/v5/CHANGELOG.md"
Issues = "https://github.com/naneziris/semiPilotPro/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
semipilot = "semipilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semipilot"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "semipilot/skills"

[tool.hatch.build.targets.sdist]
include = ["src/", "skills/", "tests/", "docs/", "bin/", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
